version: '3.8'

services:
  meeting-materials:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENV=prod
    container_name: meeting-materials
    image: meeting-materials:latest
    ports:
      - "${PORT:-80}:80"
    environment:
      - TZ=Asia/Shanghai
      - PORT=80
    volumes:
      - ./logs:/var/log/nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - meeting-materials-net

networks:
  meeting-materials-net:
    driver: bridge
